<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Battle Pass ROI Calculator</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/recharts@2.10.3/dist/Recharts.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #2d1b69 100%);
            color: #e2e8f0;
            min-height: 100vh;
            padding: 20px;
        }

        #root {
            max-width: 1400px;
            margin: 0 auto;
        }

        .container {
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(139, 92, 246, 0.3);
            border-radius: 16px;
            padding: 40px;
            backdrop-filter: blur(10px);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
            border-bottom: 2px solid rgba(139, 92, 246, 0.3);
            padding-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5rem;
            background: linear-gradient(135deg, #a78bfa 0%, #60a5fa 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .header p {
            color: #cbd5e1;
            font-size: 1.1rem;
        }

        .content-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
            margin-bottom: 40px;
        }

        @media (max-width: 1024px) {
            .content-grid {
                grid-template-columns: 1fr;
            }
        }

        .section {
            background: rgba(30, 27, 75, 0.5);
            border: 1px solid rgba(139, 92, 246, 0.2);
            border-radius: 12px;
            padding: 25px;
            transition: all 0.3s ease;
        }

        .section:hover {
            border-color: rgba(139, 92, 246, 0.5);
            box-shadow: 0 10px 30px rgba(139, 92, 246, 0.1);
        }

        .section h2 {
            color: #a78bfa;
            font-size: 1.4rem;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .section h2::before {
            content: '';
            width: 4px;
            height: 24px;
            background: linear-gradient(180deg, #a78bfa 0%, #60a5fa 100%);
            border-radius: 2px;
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #cbd5e1;
            font-weight: 500;
            font-size: 0.95rem;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 12px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(139, 92, 246, 0.3);
            border-radius: 8px;
            color: #e2e8f0;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #a78bfa;
            box-shadow: 0 0 15px rgba(167, 139, 250, 0.3);
            background: rgba(15, 23, 42, 0.8);
        }

        .form-group input::placeholder {
            color: #64748b;
        }

        .results-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-top: 20px;
        }

        @media (max-width: 768px) {
            .results-grid {
                grid-template-columns: 1fr;
            }
        }

        .metric {
            background: rgba(15, 23, 42, 0.7);
            border-left: 3px solid #a78bfa;
            padding: 15px;
            border-radius: 8px;
            transition: all 0.3s ease;
        }

        .metric:hover {
            background: rgba(15, 23, 42, 0.9);
            transform: translateX(5px);
        }

        .metric-label {
            color: #94a3b8;
            font-size: 0.85rem;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .metric-value {
            color: #a78bfa;
            font-size: 1.8rem;
            font-weight: 700;
        }

        .metric-subtext {
            color: #64748b;
            font-size: 0.8rem;
            margin-top: 5px;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: rgba(100, 116, 139, 0.3);
            border-radius: 4px;
            overflow: hidden;
            margin-top: 10px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #a78bfa 0%, #60a5fa 100%);
            transition: width 0.3s ease;
            border-radius: 4px;
        }

        .status-badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            margin-top: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .status-badge.good {
            background: rgba(34, 197, 94, 0.2);
            color: #86efac;
            border: 1px solid #22c55e;
        }

        .status-badge.caution {
            background: rgba(251, 146, 60, 0.2);
            color: #fdba74;
            border: 1px solid #fb923c;
        }

        .status-badge.poor {
            background: rgba(239, 68, 68, 0.2);
            color: #fca5a5;
            border: 1px solid #ef4444;
        }

        .comparison-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 20px;
        }

        @media (max-width: 768px) {
            .comparison-container {
                grid-template-columns: 1fr;
            }
        }

        .comparison-card {
            background: rgba(15, 23, 42, 0.7);
            border-radius: 8px;
            padding: 20px;
            border: 1px solid rgba(139, 92, 246, 0.2);
        }

        .comparison-card h3 {
            color: #a78bfa;
            margin-bottom: 15px;
            font-size: 1.1rem;
        }

        .price-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid rgba(139, 92, 246, 0.1);
        }

        .price-item:last-child {
            border-bottom: none;
        }

        .price-item-label {
            color: #cbd5e1;
            font-size: 0.9rem;
        }

        .price-item-value {
            color: #60a5fa;
            font-weight: 600;
        }

        .chart-container {
            background: rgba(15, 23, 42, 0.5);
            border: 1px solid rgba(139, 92, 246, 0.2);
            border-radius: 8px;
            padding: 20px;
            margin-top: 20px;
        }

        .behavioral-section {
            background: rgba(30, 27, 75, 0.5);
            border: 1px solid rgba(139, 92, 246, 0.2);
            border-radius: 12px;
            padding: 25px;
            margin-top: 40px;
        }

        .behavioral-section h2 {
            color: #a78bfa;
            font-size: 1.4rem;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .behavioral-section h2::before {
            content: '';
            width: 4px;
            height: 24px;
            background: linear-gradient(180deg, #a78bfa 0%, #60a5fa 100%);
            border-radius: 2px;
        }

        .insight-card {
            background: rgba(15, 23, 42, 0.6);
            border-left: 3px solid #60a5fa;
            padding: 18px;
            margin-bottom: 15px;
            border-radius: 8px;
            transition: all 0.3s ease;
        }

        .insight-card:hover {
            border-left-color: #a78bfa;
            background: rgba(15, 23, 42, 0.8);
        }

        .insight-card h3 {
            color: #60a5fa;
            margin-bottom: 8px;
            font-size: 1rem;
        }

        .insight-card p {
            color: #cbd5e1;
            font-size: 0.95rem;
            line-height: 1.5;
        }

        .warning-box {
            background: rgba(251, 146, 60, 0.1);
            border: 1px solid rgba(251, 146, 60, 0.3);
            border-left: 3px solid #fb923c;
            padding: 15px;
            border-radius: 8px;
            color: #fdba74;
            margin-top: 15px;
            font-size: 0.95rem;
        }

        .good-value-box {
            background: rgba(34, 197, 94, 0.1);
            border: 1px solid rgba(34, 197, 94, 0.3);
            border-left: 3px solid #22c55e;
            padding: 15px;
            border-radius: 8px;
            color: #86efac;
            margin-top: 15px;
            font-size: 0.95rem;
        }

        .footer {
            text-align: center;
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid rgba(139, 92, 246, 0.2);
            color: #64748b;
            font-size: 0.9rem;
        }

        .tier-badge {
            display: inline-block;
            background: rgba(139, 92, 246, 0.2);
            border: 1px solid rgba(139, 92, 246, 0.4);
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            margin-left: 8px;
            color: #a78bfa;
        }

        .chart-wrapper {
            width: 100%;
            height: 300px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .recharts-wrapper {
            width: 100%;
            height: 100%;
        }

        .no-data {
            color: #94a3b8;
            text-align: center;
            padding: 40px 20px;
            font-style: italic;
        }

        .premium-badge {
            background: linear-gradient(135deg, #fbbf24 0%, #f59e0b 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-weight: 700;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo, useEffect } = React;
        const { LineChart, Line, BarChart, Bar, XAxis, YAxis, CartesianGrid, Tooltip, Legend, ResponsiveContainer, PieChart, Pie, Cell } = Recharts;

        const GAMES_DATA = {
            fortnite: {
                name: 'Fortnite',
                tiers: 100,
                freePass: false,
                paidPrice: 9.99,
                estimatedHours: 75,
                estimatedValue: 150,
                itemCount: 100,
                avgItemPrice: 1.50,
            },
            apex: {
                name: 'Apex Legends',
                tiers: 110,
                freePass: true,
                paidPrice: 9.99,
                estimatedHours: 100,
                estimatedValue: 160,
                itemCount: 110,
                avgItemPrice: 1.45,
            },
            valorant: {
                name: 'Valorant',
                tiers: 50,
                freePass: true,
                paidPrice: 10.00,
                estimatedHours: 50,
                estimatedValue: 120,
                itemCount: 50,
                avgItemPrice: 2.40,
            },
            rocketleague: {
                name: 'Rocket League',
                tiers: 70,
                freePass: true,
                paidPrice: 9.99,
                estimatedHours: 60,
                estimatedValue: 100,
                itemCount: 70,
                avgItemPrice: 1.43,
            },
            codwarzone: {
                name: 'COD Warzone',
                tiers: 100,
                freePass: false,
                paidPrice: 19.99,
                estimatedHours: 120,
                estimatedValue: 200,
                itemCount: 100,
                avgItemPrice: 2.00,
            },
        };

        function BattlePassROI() {
            const [selectedGame, setSelectedGame] = useState('fortnite');
            const [hoursPerWeek, setHoursPerWeek] = useState(10);
            const [isPremium, setIsPremium] = useState(true);
            const [currentWeek, setCurrentWeek] = useState(1);

            const gameData = GAMES_DATA[selectedGame];

            const calculations = useMemo(() => {
                const hoursPerTier = gameData.estimatedHours / gameData.tiers;
                const weeksToComplete = gameData.estimatedHours / hoursPerWeek;
                const completionPercentage = Math.min((hoursPerWeek * currentWeek) / gameData.estimatedHours * 100, 100);
                const tiersUnlocked = Math.min(Math.floor((hoursPerWeek * currentWeek) / hoursPerTier), gameData.tiers);

                const costPerTier = isPremium ? gameData.paidPrice / gameData.tiers : 0;
                const costPerItem = isPremium ? gameData.paidPrice / gameData.itemCount : 0;

                const valueIfBuyingDirectly = gameData.itemCount * gameData.avgItemPrice;
                const valueUnlocked = tiersUnlocked * (gameData.paidPrice / gameData.tiers) / costPerTier;

                const roi = isPremium ? ((valueIfBuyingDirectly - gameData.paidPrice) / gameData.paidPrice * 100) : 0;

                return {
                    hoursPerTier,
                    weeksToComplete,
                    completionPercentage,
                    tiersUnlocked,
                    costPerTier,
                    costPerItem,
                    valueIfBuyingDirectly,
                    valueUnlocked,
                    roi,
                    willComplete: completionPercentage >= 100,
                };
            }, [selectedGame, hoursPerWeek, isPremium, currentWeek]);

            const completionData = useMemo(() => {
                const weeks = Math.ceil(calculations.weeksToComplete);
                const data = [];
                for (let w = 1; w <= Math.min(weeks + 2, 52); w++) {
                    const completion = Math.min((hoursPerWeek * w) / gameData.estimatedHours * 100, 100);
                    const tiers = Math.min(Math.floor((hoursPerWeek * w) / calculations.hoursPerTier), gameData.tiers);
                    data.push({
                        week: w,
                        completion: Math.round(completion),
                        tiers: tiers,
                    });
                }
                return data;
            }, [hoursPerWeek, gameData, calculations.hoursPerTier]);

            const costComparisonData = useMemo(() => {
                if (!isPremium) {
                    return [
                        { name: 'Battle Pass\n(Free)', cost: 0, color: '#22c55e' },
                        { name: 'Buy Individual\nItems', cost: calculations.valueIfBuyingDirectly, color: '#ef4444' },
                    ];
                }
                return [
                    { name: 'Battle Pass\n(Paid)', cost: gameData.paidPrice, color: '#a78bfa' },
                    { name: 'Buy Individual\nItems', cost: calculations.valueIfBuyingDirectly, color: '#ef4444' },
                    { name: 'Your Savings', cost: Math.max(0, calculations.valueIfBuyingDirectly - gameData.paidPrice), color: '#22c55e' },
                ];
            }, [isPremium, gameData.paidPrice, calculations.valueIfBuyingDirectly]);

            const passTypeData = useMemo(() => {
                return [
                    { name: 'Pass Cost', value: isPremium ? gameData.paidPrice : 0, fill: '#a78bfa' },
                    { name: 'Perceived Value', value: calculations.valueIfBuyingDirectly, fill: '#60a5fa' },
                ];
            }, [isPremium, gameData.paidPrice, calculations.valueIfBuyingDirectly]);

            const getCompletionStatus = () => {
                const pct = calculations.completionPercentage;
                if (pct >= 100) return { text: '✓ ACHIEVABLE', class: 'good' };
                if (pct >= 75) return { text: '⚠ CHALLENGING', class: 'caution' };
                if (pct >= 50) return { text: '✗ DIFFICULT', class: 'poor' };
                return { text: '✗ NOT ACHIEVABLE', class: 'poor' };
            };

            const status = getCompletionStatus();

            useEffect(() => {
                if (currentWeek > Math.ceil(calculations.weeksToComplete) && calculations.weeksToComplete > 0) {
                    setCurrentWeek(Math.ceil(calculations.weeksToComplete));
                }
            }, [selectedGame, hoursPerWeek]);

            return (
                <div className="container">
                    <div className="header">
                        <h1>⚔️ Battle Pass ROI Calculator</h1>
                        <p>Calculate whether a battle pass is worth your time and money</p>
                    </div>

                    <div className="content-grid">
                        {/* INPUT SECTION */}
                        <div className="section">
                            <h2>Game & Settings</h2>

                            <div className="form-group">
                                <label htmlFor="game-select">Select Your Game</label>
                                <select
                                    id="game-select"
                                    value={selectedGame}
                                    onChange={(e) => setSelectedGame(e.target.value)}
                                >
                                    {Object.entries(GAMES_DATA).map(([key, game]) => (
                                        <option key={key} value={key}>
                                            {game.name}
                                        </option>
                                    ))}
                                </select>
                            </div>

                            <div className="form-group">
                                <label htmlFor="hours-input">
                                    Hours Per Week
                                    <span className="tier-badge">{hoursPerWeek}h</span>
                                </label>
                                <input
                                    id="hours-input"
                                    type="range"
                                    min="1"
                                    max="50"
                                    value={hoursPerWeek}
                                    onChange={(e) => setHoursPerWeek(Number(e.target.value))}
                                    style={{ cursor: 'pointer' }}
                                />
                                <div style={{ marginTop: '8px', color: '#94a3b8', fontSize: '0.9rem' }}>
                                    {hoursPerWeek * 4} hours/month
                                </div>
                            </div>

                            <div className="form-group">
                                <label style={{ display: 'flex', gap: '12px', cursor: 'pointer' }}>
                                    <input
                                        type="checkbox"
                                        checked={isPremium}
                                        onChange={(e) => setIsPremium(e.target.checked)}
                                        style={{ width: 'auto', cursor: 'pointer' }}
                                    />
                                    <span>
                                        Purchase Premium Pass
                                        {isPremium && <span className="premium-badge"> ${gameData.paidPrice.toFixed(2)}</span>}
                                    </span>
                                </label>
                            </div>

                            <div className="form-group">
                                <label htmlFor="week-slider">
                                    View Progress at Week
                                    <span className="tier-badge">Week {currentWeek}</span>
                                </label>
                                <input
                                    id="week-slider"
                                    type="range"
                                    min="1"
                                    max={Math.max(Math.ceil(calculations.weeksToComplete) + 5, 10)}
                                    value={currentWeek}
                                    onChange={(e) => setCurrentWeek(Number(e.target.value))}
                                    style={{ cursor: 'pointer' }}
                                />
                            </div>

                            <div style={{ marginTop: '30px', padding: '20px', background: 'rgba(15, 23, 42, 0.5)', borderRadius: '8px', border: '1px solid rgba(139, 92, 246, 0.2)' }}>
                                <div style={{ color: '#94a3b8', fontSize: '0.85rem', marginBottom: '8px' }}>GAME INFO</div>
                                <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '10px', color: '#e2e8f0', fontSize: '0.9rem' }}>
                                    <div>
                                        <div style={{ color: '#64748b' }}>Total Tiers</div>
                                        <div style={{ color: '#a78bfa', fontWeight: 600 }}>{gameData.tiers}</div>
                                    </div>
                                    <div>
                                        <div style={{ color: '#64748b' }}>Est. Hours</div>
                                        <div style={{ color: '#60a5fa', fontWeight: 600 }}>{gameData.estimatedHours}h</div>
                                    </div>
                                    <div>
                                        <div style={{ color: '#64748b' }}>Items Unlocked</div>
                                        <div style={{ color: '#a78bfa', fontWeight: 600 }}>{gameData.itemCount}</div>
                                    </div>
                                    <div>
                                        <div style={{ color: '#64748b' }}>Est. Value</div>
                                        <div style={{ color: '#60a5fa', fontWeight: 600 }}>${gameData.estimatedValue}</div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        {/* RESULTS SECTION */}
                        <div className="section">
                            <h2>Completion & ROI Analysis</h2>

                            <div className="results-grid">
                                <div className="metric">
                                    <div className="metric-label">Completion Forecast</div>
                                    <div className="metric-value">{calculations.completionPercentage.toFixed(1)}%</div>
                                    <div className="progress-bar">
                                        <div
                                            className="progress-fill"
                                            style={{ width: `${calculations.completionPercentage}%` }}
                                        ></div>
                                    </div>
                                    <div style={{ marginTop: '10px' }}>
                                        <span className={`status-badge ${status.class}`}>{status.text}</span>
                                    </div>
                                </div>

                                <div className="metric">
                                    <div className="metric-label">Weeks to Complete</div>
                                    <div className="metric-value">{calculations.weeksToComplete.toFixed(1)}</div>
                                    <div className="metric-subtext">
                                        at {hoursPerWeek}h/week
                                    </div>
                                </div>

                                <div className="metric">
                                    <div className="metric-label">Current Tier Progress</div>
                                    <div className="metric-value">{calculations.tiersUnlocked}/{gameData.tiers}</div>
                                    <div className="metric-subtext">
                                        Week {currentWeek} • {Math.round((calculations.tiersUnlocked / gameData.tiers) * 100)}% of pass
                                    </div>
                                </div>

                                <div className="metric">
                                    <div className="metric-label">Cost Per Tier</div>
                                    <div className="metric-value">${calculations.costPerTier.toFixed(2)}</div>
                                    <div className="metric-subtext">
                                        {isPremium ? `vs $${gameData.avgItemPrice.toFixed(2)}/item` : 'Free Pass'}
                                    </div>
                                </div>

                                {isPremium && (
                                    <>
                                        <div className="metric">
                                            <div className="metric-label">ROI (Return on Investment)</div>
                                            <div className="metric-value">{calculations.roi.toFixed(0)}%</div>
                                            <div className="metric-subtext">
                                                vs buying items individually
                                            </div>
                                        </div>

                                        <div className="metric">
                                            <div className="metric-label">Potential Savings</div>
                                            <div className="metric-value">${Math.max(0, calculations.valueIfBuyingDirectly - gameData.paidPrice).toFixed(2)}</div>
                                            <div className="metric-subtext">
                                                if you complete the pass
                                            </div>
                                        </div>
                                    </>
                                )}
                            </div>
                        </div>
                    </div>

                    {/* CHARTS SECTION */}
                    <div className="section">
                        <h2>Completion Timeline</h2>
                        <div className="chart-wrapper">
                            <ResponsiveContainer width="100%" height={300}>
                                <LineChart data={completionData} margin={{ top: 5, right: 30, left: 0, bottom: 5 }}>
                                    <CartesianGrid strokeDasharray="3 3" stroke="rgba(139, 92, 246, 0.1)" />
                                    <XAxis
                                        dataKey="week"
                                        stroke="#64748b"
                                        style={{ fontSize: '12px' }}
                                    />
                                    <YAxis
                                        yAxisId="left"
                                        stroke="#64748b"
                                        style={{ fontSize: '12px' }}
                                    />
                                    <YAxis
                                        yAxisId="right"
                                        orientation="right"
                                        stroke="#64748b"
                                        style={{ fontSize: '12px' }}
                                    />
                                    <Tooltip
                                        contentStyle={{
                                            background: 'rgba(15, 23, 42, 0.95)',
                                            border: '1px solid rgba(139, 92, 246, 0.5)',
                                            borderRadius: '8px',
                                            color: '#e2e8f0',
                                        }}
                                    />
                                    <Legend />
                                    <Line
                                        yAxisId="left"
                                        type="monotone"
                                        dataKey="completion"
                                        stroke="#a78bfa"
                                        strokeWidth={3}
                                        dot={{ fill: '#a78bfa', r: 4 }}
                                        activeDot={{ r: 6 }}
                                        name="Completion %"
                                    />
                                    <Line
                                        yAxisId="right"
                                        type="monotone"
                                        dataKey="tiers"
                                        stroke="#60a5fa"
                                        strokeWidth={3}
                                        dot={{ fill: '#60a5fa', r: 4 }}
                                        activeDot={{ r: 6 }}
                                        name="Tiers Unlocked"
                                    />
                                </LineChart>
                            </ResponsiveContainer>
                        </div>
                    </div>

                    {/* COST COMPARISON */}
                    <div className="content-grid" style={{ marginTop: '40px' }}>
                        <div className="section">
                            <h2>Cost Breakdown</h2>
                            <div className="comparison-container">
                                <div className="comparison-card">
                                    <h3>Battle Pass Route</h3>
                                    <div className="price-item">
                                        <span className="price-item-label">Pass Cost</span>
                                        <span className="price-item-value">${isPremium ? gameData.paidPrice.toFixed(2) : '0.00'}</span>
                                    </div>
                                    <div className="price-item">
                                        <span className="price-item-label">Items Unlocked</span>
                                        <span className="price-item-value">{gameData.itemCount}</span>
                                    </div>
                                    <div className="price-item">
                                        <span className="price-item-label">Cost Per Item</span>
                                        <span className="price-item-value">${calculations.costPerItem.toFixed(3)}</span>
                                    </div>
                                    <div style={{ marginTop: '15px', paddingTop: '15px', borderTop: '1px solid rgba(139, 92, 246, 0.2)' }}>
                                        <div className="price-item">
                                            <span className="price-item-label" style={{ fontWeight: 600, color: '#cbd5e1' }}>Total Investment</span>
                                            <span className="price-item-value" style={{ fontSize: '1.4rem' }}>${isPremium ? gameData.paidPrice.toFixed(2) : '0.00'}</span>
                                        </div>
                                    </div>
                                </div>

                                <div className="comparison-card">
                                    <h3>Buy Items Individually</h3>
                                    <div className="price-item">
                                        <span className="price-item-label">Avg Item Price</span>
                                        <span className="price-item-value">${gameData.avgItemPrice.toFixed(2)}</span>
                                    </div>
                                    <div className="price-item">
                                        <span className="price-item-label">Total Items</span>
                                        <span className="price-item-value">{gameData.itemCount}</span>
                                    </div>
                                    <div className="price-item">
                                        <span className="price-item-label">Individual Cost</span>
                                        <span className="price-item-value">${calculations.valueIfBuyingDirectly.toFixed(2)}</span>
                                    </div>
                                    <div style={{ marginTop: '15px', paddingTop: '15px', borderTop: '1px solid rgba(139, 92, 246, 0.2)' }}>
                                        <div className="price-item">
                                            <span className="price-item-label" style={{ fontWeight: 600, color: '#cbd5e1' }}>Total Cost</span>
                                            <span className="price-item-value" style={{ fontSize: '1.4rem' }}>${calculations.valueIfBuyingDirectly.toFixed(2)}</span>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            {isPremium && (
                                <div style={{ marginTop: '25px' }}>
                                    <div className="price-item" style={{ borderBottom: '2px solid rgba(139, 92, 246, 0.3)', paddingBottom: '15px' }}>
                                        <span style={{ color: '#a78bfa', fontWeight: 600, fontSize: '1.1rem' }}>Your Savings</span>
                                        <span style={{ color: '#22c55e', fontWeight: 700, fontSize: '1.4rem' }}>
                                            ${Math.max(0, calculations.valueIfBuyingDirectly - gameData.paidPrice).toFixed(2)}
                                        </span>
                                    </div>
                                    <div style={{ marginTop: '12px', color: '#86efac', fontSize: '0.9rem' }}>
                                        ✓ You get {Math.round((calculations.valueIfBuyingDirectly / gameData.paidPrice) * 100)}% value for your money
                                    </div>
                                </div>
                            )}
                        </div>

                        <div className="section">
                            <h2>Visual Comparison</h2>
                            {costComparisonData.length > 0 && (
                                <div className="chart-wrapper">
                                    <ResponsiveContainer width="100%" height={300}>
                                        <BarChart data={costComparisonData} margin={{ top: 5, right: 30, left: 0, bottom: 40 }}>
                                            <CartesianGrid strokeDasharray="3 3" stroke="rgba(139, 92, 246, 0.1)" />
                                            <XAxis
                                                dataKey="name"
                                                stroke="#64748b"
                                                style={{ fontSize: '12px' }}
                                            />
                                            <YAxis stroke="#64748b" style={{ fontSize: '12px' }} />
                                            <Tooltip
                                                contentStyle={{
                                                    background: 'rgba(15, 23, 42, 0.95)',
                                                    border: '1px solid rgba(139, 92, 246, 0.5)',
                                                    borderRadius: '8px',
                                                    color: '#e2e8f0',
                                                }}
                                                formatter={(value) => `$${value.toFixed(2)}`}
                                            />
                                            <Bar dataKey="cost" radius={[8, 8, 0, 0]}>
                                                {costComparisonData.map((entry, index) => (
                                                    <Cell key={`cell-${index}`} fill={entry.color} />
                                                ))}
                                            </Bar>
                                        </BarChart>
                                    </ResponsiveContainer>
                                </div>
                            )}
                        </div>
                    </div>

                    {/* BEHAVIORAL ECONOMICS SECTION */}
                    <div className="behavioral-section">
                        <h2>Understanding Battle Pass Psychology</h2>

                        <div className="insight-card">
                            <h3>🎯 The Sunk Cost Fallacy</h3>
                            <p>
                                You've spent {isPremium ? '$' + gameData.paidPrice.toFixed(2) : 'time getting free tiers'}. It's tempting to keep playing "to get your money's worth," but this ignores future opportunity costs. <strong>Only continue if future enjoyment is the goal—not past spending.</strong>
                            </p>
                            {isPremium && (
                                <div className="warning-box">
                                    You're at risk of sunk cost thinking if you're grinding hours you wouldn't normally play just to "complete" the pass and justify the ${gameData.paidPrice.toFixed(2)} purchase.
                                </div>
                            )}
                        </div>

                        <div className="insight-card">
                            <h3>😰 FOMO (Fear of Missing Out) Mechanics</h3>
                            <p>
                                Battle passes are <em>designed</em> to create urgency: limited-time cosmetics, weekly challenges, seasonal resets. Game developers engineer a fear that you'll "miss out" if you don't play constantly. <strong>Real talk: These items return, or similar ones will.</strong> The perceived scarcity is often artificial.
                            </p>
                            {!calculations.willComplete && (
                                <div className="warning-box">
                                    ⚠️ At your current playtime ({hoursPerWeek}h/week), you won't complete this pass. FOMO might push you to buy tiers individually—resist. Ask: "Do I actually want these items, or do I want to avoid regret?"
                                </div>
                            )}
                        </div>

                        <div className="insight-card">
                            <h3>💎 The Endowment Effect</h3>
                            <p>
                                Once you unlock an item in the pass, you feel you "own" it and overvalue it compared to the same item you could buy directly. This inflates your perceived ROI. <strong>Counter it: Would you pay full price for these items if they weren't "locked" behind a pass?</strong> If not, you're paying for the psychological reward of unlocking, not the items themselves.
                            </p>
                        </div>

                        <div className="insight-card">
                            <h3>💰 What Actually Makes a "Good Value"</h3>
                            <p>
                                A battle pass is good value if:
                            </p>
                            <ul style={{ marginTop: '10px', marginLeft: '20px', color: '#cbd5e1' }}>
                                <li>✓ You'll complete {calculations.willComplete ? '(you will!)' : '(you probably won\'t—reconsider)'} it with normal playtime</li>
                                <li>✓ You genuinely like most of the cosmetics, not just "enough to justify the cost"</li>
                                <li>✓ You're playing for fun, not grinding to maximize ROI</li>
                                <li>✓ The cost per hour entertained is lower than other hobbies</li>
                            </ul>
                            {calculations.willComplete && isPremium && (
                                <div className="good-value-box">
                                    ✓ <strong>You're in a good position:</strong> You'll likely complete the pass with normal play. The value is real, not artificially created.
                                </div>
                            )}
                        </div>

                        <div className="insight-card">
                            <h3>📊 The Reality Check</h3>
                            <p>
                                <strong>Cost-per-hour analysis:</strong> You're spending ${isPremium ? (gameData.paidPrice / gameData.estimatedHours).toFixed(2) : '0.00'} per hour of gameplay to unlock these items. Is that worth it compared to buying skins directly? Compared to a movie ticket ($15 for 2.5 hours)? Compared to your favorite other hobby?
                            </p>
                            <p style={{ marginTop: '12px' }}>
                                <strong>The honest metric:</strong> Not ROI, but <em>cost per hour of fun</em>. Games aren't investments—they're entertainment. If this pass costs you ${isPremium ? gameData.paidPrice.toFixed(2) : '0.00'} and you'll play {gameData.estimatedHours} hours, you're paying ${(isPremium ? gameData.paidPrice / gameData.estimatedHours : 0).toFixed(2)}/hour. Is that in line with what you'd pay for other entertainment?
                            </p>
                        </div>
                    </div>

                    <div className="footer">
                        <p>
                            Created as a portfolio piece exploring game design economics and behavioral decision-making.
                            <br />
                            This tool helps you make rational purchasing decisions in an ecosystem engineered for emotional ones.
                        </p>
                    </div>
                </div>
            );
        }

        ReactDOM.render(<BattlePassROI />, document.getElementById('root'));
    </script>
</body>
</html>
